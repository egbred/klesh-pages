<style>
/* Shared kit, identical in every Klesh mini app: iOS grouped look, Telegram theme, system type,
   spacing 4/8/12/16/24, radii 12/16, segmented tabs, chips, disclosure chevrons, 44pt targets. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --muted:#6C6C70; --rule:rgba(60,60,67,.22);
  --accent:#007AFF; --accent-text:#0062D1; --accent-fill:#0062D1; --on-accent:#FFFFFF;
  --hot:#E0582F; --hot-text:#B93E0E; --hot-fill:#CC4516; --good:#248A3D; --good-text:#1D7333; --good-fill:#1A7F37; --wool:#B9A27C;
  --seg:rgba(118,118,128,.12); --seg-on:#FFFFFF; --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not(.tg){
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#AEAEB2; --rule:rgba(84,84,88,.65);
  --accent:#0A84FF; --accent-text:#4DA3FF; --accent-fill:#0A6CD6; --on-accent:#FFFFFF;
  --hot:#F07A52; --hot-text:#FF8F66; --good:#30D158; --good-text:#30D158; --wool:#C9B48E;
  --seg:rgba(118,118,128,.24); --seg-on:#636366; --seg-shadow:none; color-scheme:dark}}
/* Inside Telegram its theme wins: grouped background = secondary_bg, cards = section_bg. */
html.tg{--bg:var(--tg-theme-secondary-bg-color,var(--tg-theme-bg-color));--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color));
  --ink:var(--tg-theme-text-color);--muted:color-mix(in srgb,var(--tg-theme-hint-color) 72%,var(--tg-theme-text-color));
  --rule:var(--tg-theme-section-separator-color,color-mix(in srgb,var(--tg-theme-hint-color) 35%,transparent));
  --accent:var(--tg-theme-button-color);--accent-text:color-mix(in srgb,var(--tg-theme-link-color) 75%,var(--tg-theme-text-color));
  --accent-fill:color-mix(in srgb,var(--tg-theme-button-color) 82%,#000);--on-accent:var(--tg-theme-button-text-color);color-scheme:light}
html.tg.tg-dark{--hot:#F07A52;--hot-text:#FF8F66;--good:#30D158;--good-text:#30D158;--wool:#C9B48E;
  --seg:rgba(118,118,128,.24);--seg-on:#636366;--seg-shadow:none;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)))}
button,a,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.brand{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.sub{color:var(--muted);font-size:15px;line-height:1.4;margin:8px 0 0}
.note{font-size:15px;line-height:1.4;color:var(--muted);margin:0}
.tag{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-text)}
.tag.hot{color:var(--hot-text)}.tag.mix{color:var(--muted)}

/* inset grouped card */
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.main{box-shadow:inset 0 0 0 2px var(--accent)}

/* segmented tabs: fit 393pt, scroll only inside the bar if they ever do not */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:2px;padding:2px;border-radius:12px;background:var(--seg);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:0;border:0;background:transparent;border-radius:10px;padding:0 10px;min-height:44px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--seg-on);box-shadow:var(--seg-shadow)}

/* chips: pill links with a 44pt target */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;
  font-size:15px;font-weight:600;color:var(--accent-text);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:44px;padding:0 20px;border:0;border-radius:999px;
  background:var(--accent-fill);color:var(--on-accent);font-size:17px;font-weight:600;text-decoration:none}
.lnk{display:inline-flex;align-items:center;align-self:flex-start;min-height:44px;color:var(--accent-text);text-decoration:none;font-size:17px}

/* disclosure: chevron instead of the native triangle */
details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer;font-weight:600;font-size:17px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";flex:none;width:9px;height:9px;margin:-5px 4px 0 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg);margin-top:5px}
@media (prefers-reduced-motion:reduce){details>summary::after{transition:none}}

/* Step-by-step picker: one question per screen, then a ranked shelf. */
html,body{height:100%}
.app{min-height:100%}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-size:28px}
.step{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:4px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--rule)}.bar i.on{background:var(--accent)}

h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,50px);line-height:.95;margin:4px 0 8px;text-transform:uppercase;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:16px;background:var(--card);padding:12px 16px;min-height:68px;color:var(--ink)}
.opt b{display:block;font-size:17px;font-weight:600}
.opt span{display:block;color:var(--muted);font-size:15px;line-height:1.35}
.opt>span:last-child{flex:1;min-width:0}
.opt::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;opacity:.7}
.opt .ico{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--bg);font-family:var(--display);font-weight:900;font-size:20px;color:var(--accent-text)}
.opt:active{background:color-mix(in srgb,var(--card) 88%,var(--ink))}
.back{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;border:0;background:transparent;color:var(--accent-text);padding:0;font-size:17px;margin:-8px 0}

.res-top{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--accent)}
.res-top h2{font-family:var(--display);font-weight:900;font-size:36px;line-height:.95;margin:0;text-transform:uppercase}
.price{align-self:flex-start;background:var(--hot-fill);color:#fff;font-family:var(--display);font-weight:900;font-size:24px;line-height:1.1;padding:4px 10px 2px;border-radius:4px;transform:rotate(-2deg)}
.why{margin:0;font-size:17px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:15px;align-items:baseline}
.facts dt{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:15px}
.pc div{min-width:0}.pc b{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pc .p b{color:var(--good-text)}.pc .c b{color:var(--hot-text)}
.pc ul{margin:4px 0 0;padding-left:18px}
.match{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}.match i{display:block;height:100%;background:var(--accent)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;text-decoration:none;border-radius:999px;font-size:15px;font-weight:600;color:var(--accent-text);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.alt-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 0 -8px;padding:0 16px}
.alt{background:var(--card);border-radius:16px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.alt b{font-size:17px;font-weight:600}.alt .ap{grid-column:2;font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap;color:var(--ink)}
.alt span:not(.ap){grid-column:1/-1;color:var(--muted);font-size:15px}

.plan{background:var(--card);border-radius:16px;padding:0 16px}
.plan ol{margin:0 0 12px;padding-left:22px;display:grid;gap:8px;font-size:15px}
.plan p{font-size:15px;color:var(--muted);margin:0 0 16px}
.again{border:0;border-radius:12px;background:var(--accent-fill);color:var(--on-accent);padding:0 16px;font-size:17px;font-weight:600;min-height:50px}
</style>
</head>
