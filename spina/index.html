<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Спина: 12 минут</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Shared kit, identical in every Klesh mini app: iOS grouped look, Telegram theme, system type,
   spacing 4/8/12/16/24, radii 12/16, segmented tabs, chips, disclosure chevrons, 44pt targets. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --muted:#6C6C70; --rule:rgba(60,60,67,.22);
  --accent:#007AFF; --accent-text:#0062D1; --accent-fill:#0062D1; --on-accent:#FFFFFF;
  --hot:#E0582F; --hot-text:#B93E0E; --hot-fill:#CC4516; --good:#248A3D; --good-text:#1D7333; --good-fill:#1A7F37; --wool:#B9A27C;
  --seg:rgba(118,118,128,.12); --seg-on:#FFFFFF; --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not(.tg){
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#AEAEB2; --rule:rgba(84,84,88,.65);
  --accent:#0A84FF; --accent-text:#4DA3FF; --accent-fill:#0A6CD6; --on-accent:#FFFFFF;
  --hot:#F07A52; --hot-text:#FF8F66; --good:#30D158; --good-text:#30D158; --wool:#C9B48E;
  --seg:rgba(118,118,128,.24); --seg-on:#636366; --seg-shadow:none; color-scheme:dark}}
/* Inside Telegram its theme wins: grouped background = secondary_bg, cards = section_bg. */
html.tg{--bg:var(--tg-theme-secondary-bg-color,var(--tg-theme-bg-color));--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color));
  --ink:var(--tg-theme-text-color);--muted:color-mix(in srgb,var(--tg-theme-hint-color) 72%,var(--tg-theme-text-color));
  --rule:var(--tg-theme-section-separator-color,color-mix(in srgb,var(--tg-theme-hint-color) 35%,transparent));
  --accent:var(--tg-theme-button-color);--accent-text:color-mix(in srgb,var(--tg-theme-link-color) 75%,var(--tg-theme-text-color));
  --accent-fill:color-mix(in srgb,var(--tg-theme-button-color) 82%,#000);--on-accent:var(--tg-theme-button-text-color);color-scheme:light}
html.tg.tg-dark{--hot:#F07A52;--hot-text:#FF8F66;--good:#30D158;--good-text:#30D158;--wool:#C9B48E;
  --seg:rgba(118,118,128,.24);--seg-on:#636366;--seg-shadow:none;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)))}
button,a,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.brand{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.sub{color:var(--muted);font-size:15px;line-height:1.4;margin:8px 0 0}
.note{font-size:15px;line-height:1.4;color:var(--muted);margin:0}
.tag{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-text)}
.tag.hot{color:var(--hot-text)}.tag.mix{color:var(--muted)}

/* inset grouped card */
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.main{box-shadow:inset 0 0 0 2px var(--accent)}

/* segmented tabs: fit 393pt, scroll only inside the bar if they ever do not */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:2px;padding:2px;border-radius:12px;background:var(--seg);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:0;border:0;background:transparent;border-radius:10px;padding:0 10px;min-height:44px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--seg-on);box-shadow:var(--seg-shadow)}

/* chips: pill links with a 44pt target */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;
  font-size:15px;font-weight:600;color:var(--accent-text);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:44px;padding:0 20px;border:0;border-radius:999px;
  background:var(--accent-fill);color:var(--on-accent);font-size:17px;font-weight:600;text-decoration:none}
.lnk{display:inline-flex;align-items:center;align-self:flex-start;min-height:44px;color:var(--accent-text);text-decoration:none;font-size:17px}

/* disclosure: chevron instead of the native triangle */
details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer;font-weight:600;font-size:17px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";flex:none;width:9px;height:9px;margin:-5px 4px 0 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg);margin-top:5px}
@media (prefers-reduced-motion:reduce){details>summary::after{transition:none}}

/* One-screen workout player. */
html,body{height:100%}
.app{min-height:100%}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-size:28px}
.streak{font-size:15px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.bar{display:flex;gap:4px}
.bar i{flex:1;height:4px;background:var(--rule);border-radius:2px}
.bar i.done{background:var(--accent)} .bar i.now{background:var(--hot)}

.stage{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.step-n{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.why{margin:0;color:var(--muted);font-size:15px}
.fig{width:100%;max-width:100%;height:auto;max-height:150px}
.fig .l{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .h{fill:var(--ink)}
.fig .a{stroke:var(--hot);stroke-width:3;fill:none;stroke-linecap:round}
.fig .g{stroke:var(--rule);stroke-width:2}
.cues{margin:0;padding-left:20px;display:grid;gap:4px;font-size:17px}
.cues li{padding-left:2px}

.clock{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 0}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--rule)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.hold .fg{stroke:var(--hot)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:56px;font-variant-numeric:tabular-nums}
.count{font-size:15px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.count b{display:block;font-family:var(--display);font-size:34px;color:var(--ink);line-height:1}
.phase{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--hot-text);text-align:center;min-height:1.5em}

.ctrls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.ctrls button{border:0;border-radius:12px;padding:0 8px;min-height:52px;background:var(--card);font-size:17px;font-weight:600;color:var(--accent-text)}
.ctrls .main{background:var(--accent-fill);color:var(--on-accent)}
.ctrls button:disabled{opacity:.35;cursor:default}

.list{background:var(--card);border-radius:16px;padding:0 16px}
.list ol{margin:0 0 12px;padding-left:22px;display:grid;gap:8px;color:var(--muted);font-size:15px}
.list li.cur{color:var(--ink);font-weight:600}
.list .note{margin:0 0 16px}
.note b{color:var(--ink)}

.done-screen{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1}
.done-screen .big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;text-transform:uppercase;color:var(--accent-text)}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">Спина · 12 мин</div>
    <div class="streak" id="streak">день 1</div>
  </header>
  <div class="bar" id="bar" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="step-n" id="stepn"></div>
    <h1 id="title"></h1>
    <p class="why" id="why"></p>
    <div id="fig"></div>
    <ul class="cues" id="cues"></ul>
    <div class="clock">
      <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg><div class="num" id="num">10</div></div>
      <div class="count" id="count"></div>
    </div>
    <div class="phase" id="phase" aria-live="polite"></div>
  </main>

  <div class="ctrls">
    <button type="button" id="prev" aria-label="Предыдущее упражнение">Назад</button>
    <button type="button" class="main" id="go">Старт</button>
    <button type="button" id="next" aria-label="Следующее упражнение">Дальше</button>
  </div>

  <details class="list">
    <summary>Весь комплекс</summary>
    <ol id="olist"></ol>
    <p class="note">Это не лечение. Если болит прямо сейчас, сначала к физиотерапевту. <b>Боль отдаёт в ногу, немеет или слабеет нога: сразу к врачу.</b></p>
  </details>
</div>

<script>
(function(){
var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!==undefined&&window.Telegram.WebApp.platform!=='unknown'?window.Telegram.WebApp:null;
if(tg){var R=document.documentElement;R.classList.add('tg');tg.ready();tg.expand();
 var sch=function(){R.classList.toggle('tg-dark',tg.colorScheme==='dark');};sch();
 try{tg.onEvent('themeChanged',sch);tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('secondary_bg_color');}catch(e){}
 try{tg.BackButton.show();tg.BackButton.onClick(function(){location.href='../';});}catch(e){}}

// stick-figure pictograms, side view, ground at y=130
var F={
 catcamel:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M80 128 L80 95 M170 128 L170 95"/><path class="l" d="M80 95 Q125 60 170 95"/><circle class="h" cx="190" cy="100" r="10"/><path class="a" d="M110 55 l15 -10 l15 10"/>',
 hinge:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M120 128 L125 95 L110 70"/><path class="l" d="M110 70 L170 45"/><circle class="h" cx="185" cy="40" r="10"/><path class="l" d="M150 53 L150 90"/><path class="a" d="M95 70 l-14 0 m6 -6 l-6 6 l6 6"/>',
 curlup:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M60 125 L150 125"/><path class="l" d="M60 125 L95 95 L120 125"/><path class="l" d="M150 125 L185 115"/><circle class="h" cx="200" cy="110" r="10"/><path class="a" d="M200 92 l0 -14 m-6 6 l6 -6 l6 6"/>',
 sideplank:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M50 126 L190 80"/><path class="l" d="M190 80 L190 126"/><circle class="h" cx="210" cy="70" r="10"/><path class="a" d="M120 125 l0 -14 m-6 6 l6 -6 l6 6"/>',
 birddog:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M100 128 L100 90 L170 90 L170 128"/><path class="l" d="M100 90 L40 85"/><path class="l" d="M170 90 L225 82"/><circle class="h" cx="190" cy="78" r="10"/>',
 bridge:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M50 125 L130 85 L165 95 L170 126"/><circle class="h" cx="38" cy="120" r="10"/><path class="a" d="M130 70 l0 -14 m-6 6 l6 -6 l6 6"/>',
 lunge:'<line class="g" x1="10" y1="130" x2="250" y2="130"/><path class="l" d="M80 126 L100 126 L130 80 L180 100 L180 126"/><path class="l" d="M130 80 L125 35"/><circle class="h" cx="124" cy="22" r="10"/><path class="a" d="M150 70 l14 0 m-6 -6 l6 6 l-6 6"/>'
};

// kind: hold = timed holds (sec x reps, per side optional); reps = count reps, tap to finish
var S=[
 {id:'catcamel',t:'Кошка-верблюд',why:'Разогреть позвоночник, не растягивая его до упора.',cues:['На четвереньках, медленно выгибай и прогибай спину','Только в комфортной амплитуде, без рывков'],kind:'reps',reps:8},
 {id:'hinge',t:'Шарнир в тазу',why:'Главный навык: наклоняться тазом, а не поясницей.',cues:['Палка вдоль спины: затылок, лопатки, крестец','Попа назад, колени мягкие, палка не отрывается'],kind:'reps',reps:10},
 {id:'curlup',t:'Скручивание Макгилла',why:'Пресс держит поясницу, не сгибая её.',cues:['Одна нога согнута, ладони под поясницей','Голова и плечи на 2–3 см, шея неподвижна'],kind:'hold',sec:10,sets:[5,3,1]},
 {id:'sideplank',t:'Боковая планка',why:'Боковые мышцы корпуса: стабильность при ходьбе и с рюкзаком.',cues:['Локоть под плечом, таз не проваливается','Тяжело: опора на колени'],kind:'hold',sec:10,sets:[3,2],sides:true},
 {id:'birddog',t:'Bird dog',why:'Учит держать спину ровной, пока двигаются руки и ноги.',cues:['Вытяни противоположные руку и ногу','Сожми кулак и напряги ягодицу, спина не прогибается'],kind:'hold',sec:10,sets:[3,2],sides:true},
 {id:'bridge',t:'Ягодичный мост',why:'Будит ягодицы, чтобы поясница не работала за них.',cues:['Стопы ближе к тазу, подними таз','Наверху сожми ягодицы на 2 секунды'],kind:'reps',reps:12},
 {id:'lunge',t:'Растяжка сгибателя бедра',why:'После сидения он укорочен и тянет поясницу вперёд.',cues:['Колено на полу, таз подкрути вперёд','Тянуть должно спереди бедра, не в пояснице'],kind:'hold',sec:30,sets:[1],sides:true}
];

// flatten each step into a queue of timed blocks
function blocks(s){var q=[];
 if(s.kind==='reps')return [{type:'reps',n:s.reps}];
 var sides=s.sides?['левая','правая']:[null];
 sides.forEach(function(side){s.sets.forEach(function(r,si){
   for(var i=0;i<r;i++)q.push({type:'hold',sec:s.sec,rep:i+1,of:r,set:si+1,sets:s.sets.length,side:side});
   if(si<s.sets.length-1)q.push({type:'rest',sec:10});
 }); if(side==='левая')q.push({type:'rest',sec:5,label:'Смена стороны'});});
 return q;}

var st={i:0,q:[],b:0,left:0,run:false,t:null};
var $=function(id){return document.getElementById(id)};
var C=2*Math.PI*52;$('arc').style.strokeDasharray=C;

function haptic(k){try{if(tg&&tg.HapticFeedback){k==='end'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.impactOccurred('medium');}else if(navigator.vibrate)navigator.vibrate(k==='end'?[60,40,60]:40);}catch(e){}}

function renderBar(){$('bar').innerHTML=S.map(function(_,k){return '<i class="'+(k<st.i?'done':k===st.i?'now':'')+'"></i>'}).join('');
 $('olist').innerHTML=S.map(function(s,k){var d=s.kind==='reps'?s.reps+' повт.':s.sets.join('-')+' × '+s.sec+' с'+(s.sides?' на сторону':'');return '<li class="'+(k===st.i?'cur':'')+'">'+s.t+' · '+d+'</li>'}).join('');}

function load(i){stop();st.i=i;var s=S[i];st.q=blocks(s);st.b=0;
 $('stepn').textContent='Упражнение '+(i+1)+' из '+S.length;
 $('title').textContent=s.t;$('why').textContent=s.why;
 $('fig').innerHTML='<svg class="fig" viewBox="0 0 260 140" aria-hidden="true">'+F[s.id]+'</svg>';
 $('cues').innerHTML=s.cues.map(function(c){return '<li>'+c+'</li>'}).join('');
 $('prev').disabled=i===0;$('next').textContent=i===S.length-1?'Финиш':'Дальше';
 renderBar();showBlock();}

function showBlock(){var b=st.q[st.b],ring=$('ring');
 if(b.type==='reps'){ring.classList.remove('hold');$('num').textContent=b.n;setArc(1);
   $('count').innerHTML='<b>'+b.n+'</b>повторов<br>в своём темпе';$('phase').textContent='';$('go').textContent='Сделал';return;}
 st.left=b.sec;$('num').textContent=b.sec;setArc(1);
 ring.classList.toggle('hold',b.type==='hold');
 if(b.type==='hold'){$('count').innerHTML='<b>'+b.rep+'/'+b.of+'</b>подход '+b.set+' из '+b.sets+(b.side?'<br>сторона: '+b.side:'');$('phase').textContent=st.run?'Держи':'';}
 else{$('count').innerHTML='<b>отдых</b>'+(b.label||'дыши');$('phase').textContent=b.label||'Отдых';}
 $('go').textContent=st.run?'Пауза':'Старт';}

function setArc(f){$('arc').style.strokeDashoffset=C*(1-f);}

function tick(){var b=st.q[st.b];st.left-=1;$('num').textContent=Math.max(st.left,0);setArc(st.left/b.sec);
 if(st.left<=0){haptic('beat');st.b++;
   if(st.b>=st.q.length){stop();haptic('end');advance();return;}
   showBlock();}}

function start(){var b=st.q[st.b];
 if(b.type==='reps'){haptic('end');advance();return;}
 st.run=true;$('go').textContent='Пауза';$('phase').textContent=b.type==='hold'?'Держи':(b.label||'Отдых');haptic('beat');
 st.t=setInterval(tick,1000);}
function stop(){st.run=false;clearInterval(st.t);st.t=null;}
function advance(){if(st.i<S.length-1)load(st.i+1);else finish();}

function finish(){stop();var n=bumpStreak();
 $('stage').innerHTML='<div class="done-screen"><div class="big">Готово</div><p>Спина сказала спасибо. Это '+n+'-й день подряд.</p><p class="note">Лучше всего каждый день понемногу, чем раз в неделю до упора.</p></div>';
 $('bar').innerHTML=S.map(function(){return '<i class="done"></i>'}).join('');
 document.querySelector('.ctrls').innerHTML='<button type="button" class="main" style="grid-column:1/-1" onclick="location.reload()">Ещё раз</button>';
 $('streak').textContent='день '+n;}

function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function bumpStreak(){var s={last:null,n:0};try{s=JSON.parse(localStorage.getItem('spina-streak'))||s}catch(e){}
 var t=today(),y=new Date(Date.now()-864e5),ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
 if(s.last!==t){s.n=s.last===ys?s.n+1:1;s.last=t;}
 try{localStorage.setItem('spina-streak',JSON.stringify(s))}catch(e){}return s.n;}
try{var s0=JSON.parse(localStorage.getItem('spina-streak'));if(s0&&s0.n)$('streak').textContent='серия: '+s0.n+' дн.'}catch(e){}

$('go').addEventListener('click',function(){st.run?(stop(),showBlock()):start();});
$('next').addEventListener('click',function(){advance();});
$('prev').addEventListener('click',function(){if(st.i>0)load(st.i-1);});
load(0);
})();
</script>
</body>
</html>
